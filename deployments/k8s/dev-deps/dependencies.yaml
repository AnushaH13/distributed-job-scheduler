# MongoDB and Redis for a LOCAL test cluster (kind, minikube) only.
# Single replicas, no backups, no authentication. In production use managed
# services (see docs/deploy-eks.md).
apiVersion: v1
kind: Service
metadata: {name: mongo, namespace: djs}
spec:
  clusterIP: None
  selector: {app: mongo}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo, namespace: djs}
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec:
      containers:
        - name: mongo
          # Same version as compose.deps.yml (MongoDB 8.x fails to start on Linux 6.19+ kernels).
          image: mongo:7.0.45-jammy
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports: [{containerPort: 27017}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: djs}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: djs}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:8.8.4-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec",
                 "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
