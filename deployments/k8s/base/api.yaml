apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: djs
  labels: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
    spec:
      # Kubernetes sends SIGTERM, waits this long, then SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        # Spread replicas across zones so one zone outage leaves the rest running.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
      containers:
        - name: api
          image: djs:dev
          command: ["/usr/local/bin/api"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: HTTP_ADDR, value: ":8080"}

          envFrom:
            - configMapRef: {name: djs-config}
            - secretRef: {name: djs-secrets}
          # Liveness: is the process alive? Never checks MongoDB or Redis, so
          # a database outage does not restart every pod at once.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should this pod get traffic? Fails while a dependency
          # is down or while the pod is shutting down.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          lifecycle:
            # Give load balancers time to stop routing here before shutdown
            # starts (native sleep action; no shell needed in distroless).
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: djs
spec:
  selector: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: djs
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: djs, app.kubernetes.io/component: api}
