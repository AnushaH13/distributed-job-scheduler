# EXAMPLE ONLY. Not listed in kustomization.yaml and never applied as is.
# Create the real secret from the command line so values never enter Git:
#
#   kubectl -n djs create secret generic djs-secrets \
#     --from-literal=MONGO_URI='mongodb+srv://user:password@cluster.example.net/' \
#     --from-literal=REDIS_PASSWORD='...'
#
# On EKS, prefer AWS Secrets Manager with the External Secrets Operator or
# the Secrets Store CSI driver, so the secret is rotated outside Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: djs-secrets
  namespace: djs
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo.djs.svc.cluster.local:27017
  REDIS_PASSWORD: ""
